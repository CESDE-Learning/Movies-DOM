<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Películas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark sticky-top">
    <div class="container">
        <span class="navbar-brand mb-0 h1">
            <i class="bi bi-film"></i> CineFlix
        </span>

        <div class="d-flex gap-2">
            <button id="btnAgregar" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalPelicula">
                <i class="bi bi-plus-circle"></i> Agregar Película
            </button>

            <button id="btnLogout" class="btn btn-danger">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>

            <button id="btnLogin" class="btn btn-primary">
                <i class="bi bi-box-arrow-in-right"></i> Login
            </button>
        </div>
    </div>
</nav>

<!-- CONTENIDO PRINCIPAL -->
<main id="mainContent" class="py-4">

    <!-- BUSCADOR Y FILTRO -->
    <section class="container mb-4" id="search-section">
        <div class="row g-3">
            <div class="col-md-6">
                <input type="text" id="inputBuscar" class="form-control" placeholder="Buscar película...">
            </div>
            <div class="col-md-6">
                <select id="selectGenero" class="form-select">
                </select>
            </div>
        </div>
    </section>

    <!-- SLIDER -->
    <section class="container mb-5">
        <h4 class="mb-3">Películas Recientes</h4>

        <div id="sliderPeliculas" class="position-relative">
            <button type="button" class="btn btn-dark position-absolute top-50 start-0 translate-middle-y"
                    onclick="scrollSlider(-1)">
                ❮
            </button>

            <div id="carouselMovies" class="d-flex gap-3 overflow-auto px-5">
                <!-- Dinámico -->
            </div>

            <button type="button" class="btn btn-dark position-absolute top-50 end-0 translate-middle-y"
                    onclick="scrollSlider(1)">
                ❯
            </button>
        </div>
    </section>

    <!-- GRID -->
    <section class="container">
        <h4 class="mb-3">Todas las Películas</h4>

        <div id="gridPeliculas" class="row g-4">
            <!-- Dinámico -->
        </div>

        <div id="sinResultados" class="alert alert-info text-center mt-4" style="display: none;">
            <i class="bi bi-search"></i> No se encontraron películas
        </div>
    </section>

</main>

<!-- MODAL PELÍCULA -->
<div class="modal fade" id="modalPelicula" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="modalTitulo">Agregar Película</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <form id="formPelicula">

                    <div class="mb-3">
                        <label class="form-label">Título</label>
                        <input type="text" class="form-control" id="inputTitulo" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Género</label>
                        <select class="form-select" id="inputGenero" required>
                            <option value="">Seleccione género</option>
                            <option value="Acción">Acción</option>
                            <option value="Drama">Drama</option>
                            <option value="Comedia">Comedia</option>
                            <option value="Ciencia Ficción">Ciencia Ficción</option>
                            <option value="Terror">Terror</option>
                            <option value="Aventura">Aventura</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Director</label>
                        <input type="text" class="form-control" id="inputDirector" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Año</label>
                        <input type="number" class="form-control" id="inputAno" min="1900" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Calificación (1-10)</label>
                        <input type="number" class="form-control" id="inputCalificacion" min="1" max="10" step="0.1" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea class="form-control" id="inputDescripcion" rows="3" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">URL de Imagen</label>
                        <input type="url" class="form-control" id="inputImagen" required>
                    </div>

                </form>
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-primary" id="btnGuardarPelicula">Guardar</button>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="/src/pages/mainPage/app/allMovies.js" type="module"></script>
<script src="/src/pages/mainPage/app/lastMovies.js" type="module"></script>
<script src="/src/layout/search.js" type="module"></script>

</body>
</html>
